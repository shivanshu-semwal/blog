theme: jekyll-theme-chirpy

lang: en
timezone: Asia/Kolkata

title: ~/tblog
tagline: Notes on code, Linux, and building useful things.
description: >-
  Shivanshu, crafting code to create solutions and a better tomorrow.

url: "https://shivanshu-semwal.github.io"
baseurl: "/blog"

github:
  username: shivanshu-semwal

twitter:
  username: shivanshusemwal

social:
  name: Shivanshu Semwal
  email: semwalshivanshu.com
  links:
    - "https://github.com/shivanshu-semwal"
    - "https://www.linkedin.com/in/shivanshu-semwal"
    - "https://twitter.com/shivanshusemwal"
    - "https://portfolio.pixelfed.social/totoro"

theme_mode:
toc: true

comments:
  provider:

paginate: 10
paginate_path: "/page:num/"

permalink: /:year/:month/:day/:title.html

plugins:
  - jekyll-archives
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  tabs:
    output: true
    sort_by: order

jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/


defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      compress_html: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
